# 视频分析 Prompts

# 默认prompt模板
default_prompt: |
  请分析这个视频并完成以下任务: {task}
  
  请提供详细的分析结果。

# 不同任务类型的专用prompts
tasks:
  describe:
    name: 视频描述
    description: 详细描述视频内容
    prompt: |
      请详细描述这个视频的内容，包括：
      1. 主要场景和环境
      2. 出现的人物、物体或动物
      3. 发生的主要事件或动作
      4. 视频的整体氛围和风格
      5. 任何值得注意的细节
      
      请用清晰、结构化的方式组织你的描述。
  
  action:
    name: 动作识别
    description: 识别视频中的动作和行为
    prompt: |
      请识别并描述视频中发生的动作和行为：
      1. 列出主要的动作或活动
      2. 描述动作的顺序和时序关系
      3. 指出执行动作的主体（人、动物或物体）
      4. 评估动作的强度、速度或特征
      
      请按时间顺序组织你的回答。
  
  scene:
    name: 场景分析
    description: 分析视频场景和环境
    prompt: |
      请分析视频的场景和环境：
      1. 场景类型（室内/室外、具体位置）
      2. 环境特征（光线、天气、时间）
      3. 空间布局和重要元素
      4. 场景的变化（如果有）
      5. 整体视觉风格和色调
      
      请提供结构化的场景分析。
  
  emotion:
    name: 情感识别
    description: 识别视频中的情感和情绪
    prompt: |
      请识别视频中表达的情感和情绪：
      1. 主要人物的情绪状态
      2. 情绪的变化过程
      3. 通过哪些线索识别情绪（表情、动作、语气等）
      4. 整体情感氛围
      
      请详细说明你的判断依据。
  
  object:
    name: 物体识别
    description: 识别视频中的物体
    prompt: |
      请识别视频中出现的主要物体：
      1. 列出所有重要物体
      2. 描述物体的位置和状态
      3. 物体之间的关系和互动
      4. 物体的数量和特征
      
      请按重要性排序。
  
  summary:
    name: 视频摘要
    description: 生成视频摘要
    prompt: |
      请为这个视频生成一个简洁的摘要：
      1. 用1-2句话概括主要内容
      2. 列出3-5个关键点
      3. 说明视频的主题或目的
      
      摘要应当简洁明了，便于快速理解视频内容。
  
  quality:
    name: 质量评估
    description: 评估视频质量
    prompt: |
      请评估这个视频的质量：
      1. 画面清晰度和分辨率
      2. 光线和曝光质量
      3. 构图和视觉美感
      4. 是否有明显的技术问题（模糊、抖动、噪点等）
      5. 整体质量评分（1-10分）
      
      请给出客观的评估和改进建议。
  
  transcription:
    name: 内容转录
    description: 转录视频中的文字和对话
    prompt: |
      请转录视频中的所有可见文字和对话：
      1. 屏幕上显示的文字内容
      2. 人物说话的内容（如果有）
      3. 字幕内容（如果有）
      
      请按时间顺序整理。

# 分析维度配置
dimensions:
  visual:
    - 颜色和色调
    - 构图和布局
    - 光线和阴影
    - 运动和动态
  
  content:
    - 主题和叙事
    - 人物和角色
    - 物体和道具
    - 环境和背景
  
  technical:
    - 分辨率和清晰度
    - 帧率和流畅度
    - 剪辑和过渡
    - 音视频同步

# 输出格式模板
output_formats:
  structured:
    format: json
    fields:
      - summary
      - key_points
      - details
      - confidence
  
  narrative:
    format: text
    style: 叙事性描述
  
  bullets:
    format: markdown
    style: 要点列表

