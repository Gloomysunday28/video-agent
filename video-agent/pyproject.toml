[project]
name = "video-agent"
version = "0.1.0"
description = "视频agent - 包含视频生成、视频识别、视频修改等功能"
readme = "README.md"
authors = [
  {name = "weiguang", email = "15728046668@163.com"}
]
maintainers = [
  {name = "weiguang", email = "15728046668@163.com"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0"
]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/weiguang/video_agent/issues"
changelog = "https://github.com/weiguang/video_agent/blob/master/changelog.md"
homepage = "https://github.com/weiguang/video_agent"

[project.scripts]
video_agent = "video_agent.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
